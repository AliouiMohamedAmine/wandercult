name: Node.js CI

on:
  push:
    branches: main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci # More reliable than npm install for CI

      - name: Run tests
        run: npm test
        env:
          CI: true
